server {
    listen 80;
    listen [::]:80;

    server_name testing.arminundartur.de;
    root /var/www/arminundartur.de/web;

    add_header X-Robots-Tag "none" always;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name testing.arminundartur.de;
    root /var/www/arminundartur.de/web;

    index index.php index.html;
    charset utf-8;
    client_max_body_size 64m;

    add_header X-Robots-Tag "none" always;

    access_log /var/log/nginx/testing.arminundartur.de.access.log;
    error_log /var/log/nginx/testing.arminundartur.de.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /.well-known/ {
        allow all;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 120;
        fastcgi_hide_header X-Robots-Tag;
    }

    location ~* \.(?:css|js|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|eot|mp4|pdf)$ {
        expires 30d;
        try_files $uri =404;
    }

    ssl_certificate /etc/letsencrypt/live/testing.arminundartur.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testing.arminundartur.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
